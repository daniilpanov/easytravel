services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: easytravel
      POSTGRES_PASSWORD: easytravel
      POSTGRES_DB: easytravel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://easytravel:easytravel@db:5432/easytravel
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
